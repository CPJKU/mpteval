[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpteval"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
            "numpy>=1.26.4", 
            "scipy>=1.12.0",
            "parangonar>=3.2.0",
            "partitura>=1.8.0",
            "matplotlib>=3.7.0",
            "fastdtw==0.3.4",
            "scikit-learn>=1.0.0",
            "tqdm>=4.0.0",
            "pretty_midi",
            "mir_eval", 
            "librosa"
            
]
description = "Musically motivated piano transcription evaluation"
readme = "README.md"
authors = [
  { name="Patricia Hu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = { find = { exclude = ["tests"] } }
include-package-data = true
[tool.setuptools.package-data]
"mpteval" = ["assets/*"]

[project.urls]
Homepage = "https://github.com/CPJKU/mpteval"
Issues = "https://github.com/CPJKU/mpteval/issues"
